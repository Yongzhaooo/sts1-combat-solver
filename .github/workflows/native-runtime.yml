name: Native runtime
on:
  workflow_dispatch:
  push:
    paths: ['overlay/**', 'tools/**', 'candidates/**', '.github/workflows/native-runtime.yml']
  pull_request:
    paths: ['overlay/**', 'tools/**', 'candidates/**', '.github/workflows/native-runtime.yml']
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        # CMake 3.31 supports VS 2022, not the VS 2026 image behind windows-latest.
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install pybind11==3.1.0 cmake==3.31.10
      - run: python tools/check_backend_launcher.py
      - run: python tools/build_solver_runtime.py
      - run: python tools/check_backend_protocol.py
